<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Esperança - Plataforma Social</title>
  <style>
    /* ==========================================================================
       1. ARQUITETURA DO DESIGN SYSTEM (VARIÁVEIS NATIVAS)
       ========================================================================== */
    :root {
      /* Paleta de Cores (Modo Claro) */
      --color-primary: #1E3A8A;        /* Azul Escuro */
      --color-primary-hover: #1D4ED8;  /* Azul Vibrante */
      --color-secondary: #0D9488;      /* Verde Esmeralda */
      --color-secondary-hover: #0F766E;/* Verde Escuro */
      --color-neutral-dark: #1F2937;   /* Texto Principal */
      --color-neutral-medium: #4B5563; /* Subtítulos */
      --color-neutral-light: #F3F4F6;  /* Fundo da Página */
      --color-neutral-white: #FFFFFF;  /* Cards e Containers */

      /* Cores Semânticas de Feedback */
      --color-success-bg: #D1FAE5;
      --color-success-text: #065F46;
      --color-error-bg: #FEE2E2;
      --color-error-text: #991B1B;
      --color-info-bg: #DBEAFE;
      --color-info-text: #1E40AF;

      /* Escala Tipográfica (5 Patamares Hierárquicos) */
      --font-size-h1: 2.25rem;    /* 36px */
      --font-size-h2: 1.75rem;    /* 28px */
      --font-size-h3: 1.25rem;    /* 20px */
      --font-size-body: 1rem;     /* 16px */
      --font-size-small: 0.875rem;/* 14px */

      /* Espaçamento Modular (Base 8px) */
      --space-xs: 0.5rem;  /* 8px */
      --space-sm: 1rem;    /* 16px */
      --space-md: 1.5rem;  /* 24px */
      --space-lg: 2rem;    /* 32px */
      --space-xl: 3rem;    /* 48px */

      /* Transições e Sombras */
      --transition-fast: all 0.2s ease-in-out;
      --transition-normal: all 0.3s ease;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
    }

    /* MODO ESCURO / ALTO CONTRASTE (WCAG AAA) */
    body.dark-mode {
      --color-primary: #3B82F6;
      --color-primary-hover: #60A5FA;
      --color-secondary: #14B8A6;
      --color-secondary-hover: #2DD4BF;
      --color-neutral-dark: #F9FAFB;
      --color-neutral-medium: #D1D5DB;
      --color-neutral-light: #121212;
      --color-neutral-white: #1F2937;

      --color-success-bg: #064E3B;
      --color-success-text: #A7F3D0;
      --color-info-bg: #1E3A8A;
      --color-info-text: #BFDBFE;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.7);
    }

    /* Reset Global */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--color-neutral-light);
      color: var(--color-neutral-dark);
      line-height: 1.6;
      font-size: var(--font-size-body);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: var(--transition-normal);
    }

    /* ==========================================================================
       2. CABEÇALHO E NAVEGAÇÃO (FLEXBOX)
       ========================================================================== */
    header {
      background-color: var(--color-primary);
      color: #FFFFFF;
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      box-shadow: var(--shadow-md);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }

    header h1 {
      font-size: var(--font-size-h1);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .btn-toggle-theme {
      background: transparent;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: var(--font-size-small);
      font-weight: 600;
      transition: var(--transition-fast);
    }

    .btn-toggle-theme:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-sm);
    }

    nav a {
      color: #FFFFFF;
      text-decoration: none;
      font-size: var(--font-size-body);
      font-weight: 600;
      padding: var(--space-xs) var(--space-sm);
      border-radius: 6px;
      border: 2px solid transparent;
      transition: var(--transition-fast);
      cursor: pointer;
    }

    nav a:hover, nav a.active {
      background-color: var(--color-primary-hover);
      transform: translateY(-2px);
    }

    nav a:focus-visible, .btn-toggle-theme:focus-visible {
      outline: 3px solid var(--color-secondary);
      outline-offset: 2px;
    }

    /* ==========================================================================
       3. CONTEÚDO PRINCIPAL (CSS GRID DE 12 COLUNAS)
       ========================================================================== */
    main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: var(--space-lg) auto;
      padding: 0 var(--space-sm);
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-md);
    }

    #app {
      grid-column: span 12;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-md);
      width: 100%;
    }

    .col-8 { grid-column: span 8; }
    .col-6 { grid-column: span 6; }
    .col-4 { grid-column: span 4; }
    .col-12 { grid-column: span 12; }

    section, article {
      background: var(--color-neutral-white);
      padding: var(--space-lg);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition-normal);
    }

    section:hover, article:hover {
      box-shadow: var(--shadow-md);
    }

    h2 {
      color: var(--color-primary);
      font-size: var(--font-size-h2);
      margin-bottom: var(--space-sm);
      border-bottom: 3px solid var(--color-secondary);
      padding-bottom: var(--space-xs);
    }

    h3 {
      font-size: var(--font-size-h3);
      color: var(--color-neutral-dark);
      margin-top: var(--space-sm);
      margin-bottom: var(--space-xs);
    }

    p {
      color: var(--color-neutral-medium);
      font-size: var(--font-size-body);
      margin-bottom: var(--space-sm);
    }

    section img {
      width: 100%;
      max-width: 220px;
      height: auto;
      display: block;
      margin: var(--space-md) auto 0 auto;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
    }

    /* ==========================================================================
       4. COMPONENTES E FORMULÁRIOS
       ========================================================================== */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: var(--font-size-small);
      font-weight: 700;
      border-radius: 50px;
      margin-bottom: var(--space-xs);
      width: fit-content;
    }

    .badge-success { background-color: var(--color-success-bg); color: var(--color-success-text); }
    .badge-info { background-color: var(--color-info-bg); color: var(--color-info-text); }

    .alert {
      padding: var(--space-sm);
      border-radius: 6px;
      font-size: var(--font-size-small);
      margin-bottom: var(--space-sm);
      border-left: 4px solid;
    }

    .alert-success {
      background-color: var(--color-success-bg);
      color: var(--color-success-text);
      border-color: var(--color-secondary);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      margin-bottom: var(--space-sm);
    }

    .form-group label {
      font-size: var(--font-size-small);
      font-weight: 600;
      color: var(--color-neutral-dark);
    }

    .form-control {
      padding: 0.65rem;
      border: 2px solid var(--color-neutral-medium);
      border-radius: 6px;
      font-size: var(--font-size-body);
      background-color: var(--color-neutral-white);
      color: var(--color-neutral-dark);
      outline: none;
      transition: var(--transition-fast);
    }

    .form-control:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    .form-control.is-valid {
      border-color: var(--color-secondary);
    }

    .form-control.is-invalid {
      border-color: #EF4444;
    }

    .error-message {
      color: #EF4444;
      font-size: 0.85rem;
      margin-top: -0.25rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .btn {
      background-color: var(--color-primary);
      color: #FFFFFF;
      padding: 0.75rem 1.25rem;
      font-size: var(--font-size-body);
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition-fast);
      align-self: flex-start;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover { background-color: var(--color-primary-hover); box-shadow: var(--shadow-md); }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 3px solid var(--color-secondary); outline-offset: 2px; }

    .btn-secondary { background-color: var(--color-secondary); }
    .btn-secondary:hover { background-color: var(--color-secondary-hover); }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--color-neutral-dark);
      color: var(--color-neutral-white);
      padding: 0.85rem 1.25rem;
      border-radius: 6px;
      box-shadow: var(--shadow-md);
      z-index: 1000;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-md);
    }

    fieldset {
      border: 2px solid var(--color-neutral-medium);
      padding: var(--space-md);
      border-radius: 8px;
    }

    legend {
      font-size: var(--font-size-h3);
      font-weight: 700;
      color: var(--color-primary);
      padding: 0 var(--space-xs);
    }

    /* ==========================================================================
       5. RODAPÉ
       ========================================================================== */
    footer {
      background-color: var(--color-neutral-dark);
      color: var(--color-neutral-white);
      text-align: center;
      padding: var(--space-md);
      font-size: var(--font-size-small);
      margin-top: auto;
    }

    /* ==========================================================================
       6. RESPONSIVIDADE (5 BREAKPOINTS)
       ========================================================================== */
    @media (max-width: 479px) {
      main, #app { grid-template-columns: repeat(4, 1fr); gap: var(--space-xs); }
      .col-8, .col-6, .col-4, .col-12 { grid-column: span 4; }
      nav ul { flex-direction: column; width: 100%; }
    }

    @media (min-width: 480px) and (max-width: 767px) {
      main, #app { grid-template-columns: repeat(4, 1fr); gap: var(--space-sm); }
      .col-8, .col-6, .col-4, .col-12 { grid-column: span 4; }
    }

    @media (min-width: 768px) and (max-width: 1023px) {
      main, #app { grid-template-columns: repeat(8, 1fr); gap: var(--space-md); }
      .col-8, .col-6, .col-4, .col-12 { grid-column: span 8; }
    }

    @media (min-width: 1024px) and (max-width: 1439px) {
      main, #app { grid-template-columns: repeat(12, 1fr); }
      .col-8 { grid-column: span 8; }
      .col-6 { grid-column: span 6; }
      .col-4 { grid-column: span 4; }
      .col-12 { grid-column: span 12; }
    }

    @media (min-width: 1440px) {
      main { max-width: 1400px; gap: var(--space-lg); }
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO E NAVEGAÇÃO COM MODO ESCURO -->
  <header>
    <div class="header-top">
      <h1>ONG Esperança</h1>
      <button id="theme-toggle" class="btn-toggle-theme" aria-label="Alternar modo escuro e claro">
        🌙 Modo Escuro
      </button>
    </div>
    <nav aria-label="Navegação Principal">
      <ul>
        <li><a data-route="inicio" class="active" href="#inicio">Início</a></li>
        <li><a data-route="projetos" href="#projetos">Projetos</a></li>
        <li><a data-route="cadastro" href="#cadastro">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL (CONTAINER DINÂMICO SPA) -->
  <main id="main-content">
    <div id="app">
      <!-- Injeção de conteúdo dinâmico via JS -->
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>&copy; 2026 ONG Esperança - Todos os direitos reservados.</p>
  </footer>

  <!-- BIBLIOTECA EXTERNA DE MÁSCARAS -->
  <script src="https://unpkg.com/imask"></script>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    /* 1. PERSISTÊNCIA LOCAL (LOCALSTORAGE) */
    const STORAGE_KEY = 'ong_cadastros_voluntarios';

    function salvarCadastro(dados) {
      const cadastros = carregarCadastros();
      cadastros.push(dados);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cadastros));
    }

    function carregarCadastros() {
      const dados = localStorage.getItem(STORAGE_KEY);
      try { return dados ? JSON.parse(dados) : []; } catch (e) { return []; }
    }

    /* 2. DADOS DINÂMICOS DE PROJETOS */
    const projetosData = [
      {
        titulo: "Reforço Escolar e Leitura",
        categoria: "Educação",
        badgeClass: "badge-success",
        descricao: "Aulas presenciais para crianças do ensino fundamental em comunidades atendidas.",
        linkText: "Apoiar Projeto"
      },
      {
        titulo: "Arrecadação de Mantimentos",
        categoria: "Ação Social",
        badgeClass: "badge-info",
        descricao: "Distribuição mensal de cestas básicas e itens essenciais para famílias cadastradas.",
        linkText: "Doar Alimentos"
      },
      {
        titulo: "Atendimento Comunitário",
        categoria: "Cidadania",
        badgeClass: "badge-success",
        descricao: "Apoio e triagem social gratuita para encaminhamento a serviços públicos.",
        linkText: "Saber Mais"
      }
    ];

    /* 3. ROTAS E TEMPLATES DA SPA */
    const routes = {
      inicio: `
        <section id="apresentacao" class="col-8">
          <div>
            <span class="badge badge-success">Projeto Ativo</span>
            <h2>Sobre a Nossa Organização</h2>
            <p>Promovemos a inclusão social e o desenvolvimento comunitário através de ações humanitárias e educação inclusiva.</p>
            <h3>Nossa Missão</h3>
            <p>Garantir oportunidades e dignidade para famílias em situação de vulnerabilidade social.</p>
          </div>
          <img src="assets/images/logo.png" alt="Voluntários da ONG trabalhando em projeto comunitário" loading="lazy">
        </section>

        <section id="contato" class="col-4">
          <div>
            <h2>Contato</h2>
            <div class="alert alert-success" role="status">
              Atendimento presencial de segunda a sexta, das 8h às 17h.
            </div>
            <p><strong>E-mail:</strong> contato@ongesperanca.org.br</p>
            <p><strong>Telefone:</strong> (11) 99999-9999</p>

            <h3>Inscreva-se na nossa Newsletter</h3>
            <form id="form-newsletter">
              <div class="form-group">
                <label for="email-news">Seu E-mail:</label>
                <input type="email" id="email-news" class="form-control" placeholder="seuemail@exemplo.com" required>
              </div>
              <button type="submit" class="btn">Cadastrar</button>
            </form>
          </div>
        </section>
      `,
      projetos: `
        <div class="col-12" style="display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--space-md);">
          <div class="col-12">
            <h2>Nossos Projetos Sociais</h2>
            <p>Conheça as iniciativas mantidas pela ONG Esperança e saiba como colaborar.</p>
          </div>
          ${projetosData.map(p => `
            <article class="col-4">
              <div>
                <span class="badge ${p.badgeClass}">${p.categoria}</span>
                <h3>${p.titulo}</h3>
                <p>${p.descricao}</p>
              </div>
              <button class="btn" onclick="mostrarToast('Obrigado pelo seu interesse!')">${p.linkText}</button>
            </article>
          `).join('')}
        </div>
      `,
      cadastro: `
        <section class="col-12">
          <h2>Faça seu Cadastro de Voluntário</h2>
          <form id="form-cadastro" class="form-grid">
            <fieldset class="col-6">
              <legend>Dados Pessoais</legend>
              <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome completo" required>
              </div>
              <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="seuemail@exemplo.com" required>
              </div>
              <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" class="form-control" placeholder="000.000.000-00" required>
              </div>
              <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(11) 99999-9999" required>
              </div>
            </fieldset>

            <fieldset class="col-6">
              <legend>Endereço</legend>
              <div class="form-group">
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000" required>
              </div>
              <div class="form-group">
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" class="form-control" placeholder="Rua, Número, Bairro" required>
              </div>
              <div class="form-group">
                <label for="cidade">Cidade / Estado:</label>
                <input type="text" id="cidade" name="cidade" class="form-control" placeholder="São Paulo / SP" required>
              </div>
            </fieldset>

            <button type="submit" class="btn col-12" style="margin-top: 1rem;">Enviar Cadastro</button>
          </form>
        </section>
      `
    };

    /* 4. ROTEAMENTO E RENDERIZAÇÃO */
    function navigateTo(route) {
      const container = document.getElementById('app');
      if (!container) return;

      container.innerHTML = routes[route] || routes['inicio'];

      document.querySelectorAll('nav a').forEach(a => {
        a.classList.toggle('active', a.getAttribute('data-route') === route);
      });

      if (route === 'cadastro') {
        aplicarMascaras();
      }
    }

    /* 5. VALIDAÇÃO E FEEDBACK VISUAL */
    const REGEX_PATTERNS = {
      cpf: /^\d{3}\.\d{3}\.\d{3}-\d{2}$/,
      telefone: /^\(\d{2}\)\s?\d{4,5}-\d{4}$/,
      email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
      cep: /^\d{5}-\d{3}$/
    };

    function validarCampo(input) {
      const container = input.parentElement;
      let mensagemErro = '';
      let isValid = true;

      if (input.hasAttribute('required') && !input.value.trim()) {
        isValid = false;
        mensagemErro = 'Este campo é obrigatório.';
      } else if (input.id in REGEX_PATTERNS && input.value.trim() !== '') {
        if (!REGEX_PATTERNS[input.id].test(input.value.trim())) {
          isValid = false;
          mensagemErro = 'Formato inválido inserido.';
        }
      }

      input.classList.toggle('is-valid', isValid);
      input.classList.toggle('is-invalid', !isValid);

      const erroExistente = container.querySelector('.error-message');
      if (erroExistente) erroExistente.remove();

      if (!isValid) {
        const span = document.createElement('span');
        span.className = 'error-message';
        span.textContent = mensagemErro;
        container.appendChild(span);
      }

      return isValid;
    }

    function mostrarToast(mensagem) {
      const toastExistente = document.querySelector('.toast');
      if (toastExistente) toastExistente.remove();

      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.setAttribute('role', 'alert');
      toast.textContent = mensagem;
      document.body.appendChild(toast);

      setTimeout(() => toast.remove(), 3500);
    }

    function aplicarMascaras() {
      if (typeof IMask === 'undefined') return;
      const cpf = document.getElementById('cpf');
      const tel = document.getElementById('telefone');
      const cep = document.getElementById('cep');

      if (cpf) IMask(cpf, { mask: '000.000.000-00' });
      if (tel) IMask(tel, { mask: [{ mask: '(00) 0000-0000' }, { mask: '(00) 00000-0000' }] });
      if (cep) IMask(cep, { mask: '00000-000' });
    }

    /* 6. MODALIDADE ESCURA (DARK MODE TOGGLE) */
    function initTheme() {
      const toggleBtn = document.getElementById('theme-toggle');
      const isDark = localStorage.getItem('theme') === 'dark';

      if (isDark) {
        document.body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️ Modo Claro';
      }

      toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const darkModeActive = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', darkModeActive ? 'dark' : 'light');
        toggleBtn.textContent = darkModeActive ? '☀️ Modo Claro' : '🌙 Modo Escuro';
      });
    }

    /* 7. EVENT DELEGATION */
    document.addEventListener('click', (e) => {
      const link = e.target.closest('[data-route]');
      if (link) {
        e.preventDefault();
        const route = link.getAttribute('data-route');
        navigateTo(route);
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.classList.contains('form-control')) {
        validarCampo(e.target);
      }
    });

    document.addEventListener('submit', (e) => {
      e.preventDefault();

      if (e.target.id === 'form-cadastro') {
        const inputs = e.target.querySelectorAll('.form-control');
        let formValido = true;

        inputs.forEach(input => {
          if (!validarCampo(input)) formValido = false;
        });

        if (formValido) {
          const formData = new FormData(e.target);
          salvarCadastro(Object.fromEntries(formData.entries()));
          mostrarToast('Cadastro realizado e salvo com sucesso!');
          e.target.reset();
          inputs.forEach(i => i.classList.remove('is-valid'));
        } else {
          mostrarToast('Por favor, corrija os erros no formulário.');
        }
      }

      if (e.target.id === 'form-newsletter') {
        mostrarToast('E-mail cadastrado com sucesso!');
        e.target.reset();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      navigateTo('inicio');
    });
  </script>
</body>
</html>
