<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Esperança - Cadastro</title>
  <style>
    /* ==========================================================================
       1. ARQUITETURA DO DESIGN SYSTEM (VARIÁVEIS NATIVAS)
       ========================================================================== */
    :root {
      /* Paleta de Cores (8 Cores Distintas) */
      --color-primary: #1E3A8A;        /* Azul Escuro (Institucional) */
      --color-primary-hover: #1D4ED8;  /* Azul Vibrante (Interação) */
      --color-secondary: #0D9488;      /* Verde Esmeralda (Ação Social) */
      --color-secondary-hover: #0F766E;/* Verde Escuro (Foco) */
      --color-neutral-dark: #1F2937;   /* Texto Principal - Contraste WCAG AAA */
      --color-neutral-medium: #4B5563; /* Subtítulos e Legendas */
      --color-neutral-light: #F3F4F6;  /* Fundo da Página */
      --color-neutral-white: #FFFFFF;  /* Cards e Containers */

      /* Cores Semânticas de Feedback */
      --color-success-bg: #D1FAE5;
      --color-success-border: #10B981;
      --color-error-bg: #FEE2E2;
      --color-error-border: #EF4444;

      /* Escala Tipográfica (5 Patamares Hierárquicos) */
      --font-size-h1: 2.25rem;    /* 36px - Título Principal */
      --font-size-h2: 1.75rem;    /* 28px - Títulos de Seções */
      --font-size-h3: 1.25rem;    /* 20px - Subtítulos e Legends */
      --font-size-body: 1rem;     /* 16px - Corpo de Texto e Inputs */
      --font-size-small: 0.875rem;/* 14px - Labels e Rodapé */

      /* Espaçamento Modular (Base 8px) */
      --space-xs: 0.5rem;  /* 8px */
      --space-sm: 1rem;    /* 16px */
      --space-md: 1.5rem;  /* 24px */
      --space-lg: 2rem;    /* 32px */
      --space-xl: 3rem;    /* 48px */

      /* Transições e Sombras */
      --transition-fast: all 0.2s ease-in-out;
      --transition-normal: all 0.3s ease;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
    }

    /* Reset Global */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--color-neutral-light);
      color: var(--color-neutral-dark);
      line-height: 1.6;
      font-size: var(--font-size-body);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ==========================================================================
       2. CABEÇALHO E NAVEGAÇÃO (FLEXBOX)
       ========================================================================== */
    header {
      background-color: var(--color-primary);
      color: var(--color-neutral-white);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      box-shadow: var(--shadow-md);
    }

    header h1 {
      font-size: var(--font-size-h1);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-sm);
    }

    /* Estados Interativos da Navegação */
    nav a {
      color: var(--color-neutral-white);
      text-decoration: none;
      font-size: var(--font-size-body);
      font-weight: 600;
      padding: var(--space-xs) var(--space-sm);
      border-radius: 6px;
      border: 2px solid transparent;
      transition: var(--transition-fast);
    }

    nav a:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-2px);
    }

    nav a:focus-visible {
      outline: 3px solid var(--color-secondary);
      outline-offset: 2px;
    }

    nav a:active {
      transform: translateY(0);
    }

    /* ==========================================================================
       3. CONTEÚDO PRINCIPAL (CSS GRID DE 12 COLUNAS)
       ========================================================================== */
    main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: var(--space-lg) auto;
      padding: 0 var(--space-sm);
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-md);
    }

    form {
      grid-column: span 12;
      background: var(--color-neutral-white);
      padding: var(--space-lg);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.05);
      transition: var(--transition-normal);

      /* Grid interno para dispor os Fieldsets lado a lado */
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: var(--space-md);
    }

    form:hover {
      box-shadow: var(--shadow-md);
    }

    /* Fieldset de Dados Pessoais (Coluna da Esquerda) */
    .fieldset-pessoais {
      grid-column: span 6;
      border: 2px solid var(--color-neutral-light);
      padding: var(--space-md);
      border-radius: 8px;
    }

    /* Fieldset de Endereço (Coluna da Direita) */
    .fieldset-endereco {
      grid-column: span 6;
      border: 2px solid var(--color-neutral-light);
      padding: var(--space-md);
      border-radius: 8px;
    }

    legend {
      font-size: var(--font-size-h3);
      font-weight: 700;
      color: var(--color-primary);
      padding: 0 var(--space-xs);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: var(--space-xs);
    }

    label {
      margin-top: var(--space-xs);
      margin-bottom: var(--space-xs);
      font-size: var(--font-size-small);
      font-weight: 600;
      color: var(--color-neutral-dark);
    }

    /* ==========================================================================
       4. ESTADOS INTERATIVOS E VALIDAÇÃO DOS INPUTS E BOTÃO
       ========================================================================== */
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"] {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid var(--color-neutral-medium);
      border-radius: 6px;
      font-size: var(--font-size-body);
      color: var(--color-neutral-dark);
      background-color: var(--color-neutral-white);
      outline: none;
      transition: var(--transition-fast);
    }

    /* Foco no Campo */
    input:focus {
      border-color: var(--color-primary-hover);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
    }

    /* Validação Visual de Sucesso */
    input:valid:not(:placeholder-shown) {
      border-color: var(--color-success-border);
      background-color: rgba(209, 250, 229, 0.1);
    }

    /* Validação Visual de Erro */
    input:invalid:not(:placeholder-shown) {
      border-color: var(--color-error-border);
      background-color: rgba(254, 226, 226, 0.1);
    }

    /* Botão de Envio (Ocupa as 12 Colunas na Base) */
    button[type="submit"] {
      grid-column: span 12;
      display: block;
      width: 100%;
      background-color: var(--color-primary);
      color: var(--color-neutral-white);
      border: 2px solid transparent;
      padding: 0.85rem;
      border-radius: 6px;
      font-size: var(--font-size-body);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-fast);
      margin-top: var(--space-sm);
    }

    button[type="submit"]:hover {
      background-color: var(--color-primary-hover);
      box-shadow: var(--shadow-md);
    }

    button[type="submit"]:focus-visible {
      outline: 3px solid var(--color-secondary);
      outline-offset: 2px;
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    /* ==========================================================================
       5. RODAPÉ
       ========================================================================== */
    footer {
      background-color: var(--color-neutral-dark);
      color: var(--color-neutral-white);
      text-align: center;
      padding: var(--space-md);
      font-size: var(--font-size-small);
      margin-top: auto;
    }

    /* ==========================================================================
       6. ADAPTABILIDADE E RESPONSIVIDADE (5 BREAKPOINTS)
       ========================================================================== */

    /* Breakpoint 1: Extra Small (< 480px) */
    @media (max-width: 479px) {
      main {
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-xs);
      }
      form {
        grid-column: span 4;
        padding: var(--space-sm);
        display: flex;
        flex-direction: column;
      }
      .fieldset-pessoais, .fieldset-endereco {
        grid-column: span 4;
      }
      header h1 {
        font-size: var(--font-size-h2);
      }
      nav ul {
        flex-direction: column;
        width: 100%;
      }
    }

    /* Breakpoint 2: Mobile (480px - 767px) */
    @media (min-width: 480px) and (max-width: 767px) {
      main {
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-sm);
      }
      form {
        grid-column: span 4;
        display: flex;
        flex-direction: column;
      }
      .fieldset-pessoais, .fieldset-endereco {
        grid-column: span 4;
      }
    }

    /* Breakpoint 3: Tablet (768px - 1023px) */
    @media (min-width: 768px) and (max-width: 1023px) {
      main {
        grid-template-columns: repeat(8, 1fr);
        gap: var(--space-md);
      }
      form {
        grid-column: span 8;
        display: flex;
        flex-direction: column;
      }
      .fieldset-pessoais, .fieldset-endereco {
        grid-column: span 8;
      }
    }

    /* Breakpoint 4: Desktop Padrão (1024px - 1439px) */
    @media (min-width: 1024px) and (max-width: 1439px) {
      main {
        grid-template-columns: repeat(12, 1fr);
      }
      form {
        grid-column: span 12;
      }
      .fieldset-pessoais, .fieldset-endereco {
        grid-column: span 6;
      }
    }

    /* Breakpoint 5: Ultra-Wide (>= 1440px) */
    @media (min-width: 1440px) {
      main {
        max-width: 1400px;
        gap: var(--space-lg);
      }
      form {
        grid-column: span 12;
      }
      .fieldset-pessoais, .fieldset-endereco {
        grid-column: span 6;
      }
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO E NAVEGAÇÃO -->
  <header>
    <h1>Faça seu Cadastro</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL (GRID 12 COLUNAS) -->
  <main>
    <form action="#" method="POST" onsubmit="event.preventDefault();">
      
      <!-- COLUNA DA ESQUERDA: DADOS PESSOAIS -->
      <fieldset class="fieldset-pessoais">
        <legend>Dados Pessoais</legend>
        
        <div class="form-group">
          <label for="nome">Nome Completo:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF:</label>
          <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" required>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s?\d{4,5}-\d{4}" placeholder="(11) 99999-9999" required>
        </div>

        <div class="form-group">
          <label for="nascimento">Data de Nascimento:</label>
          <input type="date" id="nascimento" name="nascimento" required>
        </div>
      </fieldset>

      <!-- COLUNA DA DIREITA: ENDEREÇO -->
      <fieldset class="fieldset-endereco">
        <legend>Endereço</legend>

        <div class="form-group">
          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" placeholder="00000-000" required>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço:</label>
          <input type="text" id="endereco" name="endereco" placeholder="Rua, Número, Bairro" required>
        </div>

        <div class="form-group">
          <label for="cidade">Cidade / Estado:</label>
          <input type="text" id="cidade" name="cidade" placeholder="São Paulo / SP" required>
        </div>
      </fieldset>

      <!-- BOTÃO DE ENVIO (LARGURA TOTAL) -->
      <button type="submit">Enviar Cadastro</button>
    </form>
  </main>

  <!-- RODAPÉ -->
  <footer>
    <p>&copy; 2026 ONG Esperança - Todos os direitos reservados.</p>
  </footer>

</body>
</html>
